# From running dpkg --info on the .deb package:
# Depends: ocl-icd-libopencl1, libvdpau1 (>= 1.3), libva-drm2 (>= 2.7.0), libc6 (>= 2.17), libcairo2 (>= 1.10.0), libgcc1 (>= 1:4.1.1), libgdk-pixbuf2.0-0 (>= 2.22.0), libgl1-mesa-glx | libgl1, libglib2.0-0 (>= 2.22.0), libglu1-mesa | libglu1, libgtk-3-0 (>= 3.0.0), libpango1.0-0 (>= 1.18.0), libstdc++6 (>= 4.6), libuuid1, libasound2, libc++1
# More dependencies can be found in the usr/lib/lightworks folder after extracting the .deb archive.

id: com.lwks.Lightworks
branch: stable
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: lightworks
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=all # udev rules for Lightworks console don't work in Flatpak, so just give Lightworks access to all devices
  - --filesystem=host
  - --env=LD_LIBRARY_PATH=/app/lib:/app/lib/lightworks:/app/lib/lightworks/BlackmagicRawAPI:/app/lib/blackmagic
  - --env=LD_PRELOAD=libmimalloc.so
modules:
  - shared-modules/glu/glu-9.json
  - name: twolame
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: http://downloads.sourceforge.net/twolame/twolame-0.4.0.tar.gz
        sha256: cc35424f6019a88c6f52570b63e1baf50f62963a3eac52a03a800bb070d7c87d

  - name: libsndio
    buildsystem: autotools
    sources:
      - type: archive
        url: https://www.sndio.org/sndio-1.7.0.tar.gz
        sha256: dda4e3d0879423ed57923975ba74668cbb9299939cad579b0ac64a4b01535552
    post-install:
      - ln -s libsndio.so.7.1 /app/lib/libsndio.so.7

  - name: portaudio
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_STATIC_LIBS=OFF
      - -DPA_BUILD_TESTS=OFF
      - -DPA_BUILD_EXAMPLES=OFF
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: https://github.com/PortAudio/portaudio/archive/refs/tags/v19.7.0.tar.gz
        sha256: 5af29ba58bbdbb7bbcefaaecc77ec8fc413f0db6f4c4e286c40c3e1b83174fa0

  - name: libedit
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://thrysoee.dk/editline/libedit-20230828-3.1.tar.gz
        sha256: 4ee8182b6e569290e7d1f44f0f78dac8716b35f656b76528f699c69c98814dad

  - name: blackmagiclibs # bundle decklink libraries
    buildsystem: simple
    build-commands:
      - tar -xf other/x86_64/desktopvideo-15.1a1-x86_64.tar.gz
      - install -Dm644 --target-directory=/app/lib/blackmagic desktopvideo-15.1a1-x86_64/usr/lib/*.so
    sources:
      - type: archive
        path: Blackmagic_Desktop_Video_Linux_15.1.tar
  - name: lightworks
    buildsystem: simple
    build-commands:
      - ar x lightworks.deb
      - tar xf data.tar.xz
      - rm -r control.tar.xz data.tar.xz debian-binary
      - install -Dm755 lightworks.sh /app/bin/lightworks
      - cp -r usr/lib/* /app/lib/
      - install -Dm644 "$(ls usr/share/applications/com.lwks.Lightworks.desktop usr/share/applications/lightworks.desktop 2>/dev/null | head -n1)" "${FLATPAK_DEST}/share/applications/com.lwks.Lightworks.desktop"
      - mv usr/share/doc/* /app/share/doc/
      - mv usr/share/fonts/* /app/share/fonts/
      - mkdir /app/share/lightworks
      - mv usr/share/lightworks/* /app/share/lightworks/
      - mkdir -p /app/share/icons/hicolor/128x128/apps
      - mv /app/share/lightworks/Icons/App.png /app/share/icons/hicolor/128x128/apps/com.lwks.Lightworks.png
      - desktop-file-edit --set-key='Icon' --set-value="${FLATPAK_ID}" "${FLATPAK_DEST}/share/applications/com.lwks.Lightworks.desktop"
      - desktop-file-edit --set-key='Exec' --set-value='/app/bin/lightworks' /app/share/applications/com.lwks.Lightworks.desktop
    sources:
      - type: file
        path: lightworks.deb
      - type: file
        path: lightworks.sh
cleanup-commands:
  - mkdir -p ${FLATPAK_DEST}/lib/blackmagic
